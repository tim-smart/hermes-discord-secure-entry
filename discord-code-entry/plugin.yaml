name: discord-code-entry
version: 0.1.0
description: >
  Enter a website's one-time verification code, or save a new login, from Discord through a private
  button + modal. The answer goes straight to the waiting browser_vault_enter_code or
  browser_vault_save_login call and never enters the chat, the model, the transcript or the logs.
provides_tools:
  - browser_vault_enter_code
  - browser_vault_save_login
capabilities:
  - tools.override
